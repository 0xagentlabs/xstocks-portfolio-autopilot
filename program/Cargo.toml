[package]
name = "xstocks-autopilot"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
pinocchio = "0.11.2"
pinocchio-system = "0.6.1"

[dev-dependencies]
hex = "0.4.3"
litesvm = "0.16.0"
serde_json = "1.0"
solana-account = "4.3.2"
solana-address = "2.6.1"
solana-instruction = "3.4.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-transaction = { version = "4.1.5", features = ["verify"] }
